<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Central Charge — Preview de telas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============ Outer chrome (this authoring tool, adapts to your OS theme) ============ */
  :root {
    --canvas: #EEF0F2;
    --canvas-panel: #FFFFFF;
    --canvas-panel-2: #F5F6F8;
    --canvas-border: #DEE1E6;
    --canvas-text: #16171A;
    --canvas-muted: #6B6E76;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas: #0B0C0E;
      --canvas-panel: #condition-unused; /* placeholder overwritten below */
      --canvas-panel: #17181B;
      --canvas-panel-2: #1D1E22;
      --canvas-border: #2B2D31;
      --canvas-text: #F1F2F4;
      --canvas-muted: #9195A0;
    }
  }
  :root[data-theme="dark"] {
    --canvas: #0B0C0E;
    --canvas-panel: #17181B;
    --canvas-panel-2: #1D1E22;
    --canvas-border: #2B2D31;
    --canvas-text: #F1F2F4;
    --canvas-muted: #9195A0;
  }

  /* ============ Fixed app palette — mirrors src/theme/index.tsx exactly.
     This is a real, always-dark product theme, not viewer-dependent. ============ */
  :root {
    --ink0: #0A0A0B;
    --ink50: #18181B;
    --ink100: #27272A;
    --ink200: #3F3F46;
    --ink300: #52525B;
    --ink400: #71717A;
    --ink500: #A1A1AA;
    --brand300: #FB923C;
    --brand400: #F97316;
    --brand500: #F97316;
    --brand600: #EA580C;
    --brand700: #C2410C;
    --app-white: #FFFFFF;
    --app-black: #000000;
    --success: #22C55E;
    --warning: #F59E0B;
    --error: #EF4444;
    --info: #3B82F6;
    --border: #3F3F46;
    --tabbg: #101010;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--canvas-text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    min-height: 100vh;
  }

  /* ============ Layout ============ */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--canvas-panel);
    border-right: 1px solid var(--canvas-border);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 6px;
  }
  .brand .mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--brand400), var(--brand600));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .brand .mark svg { width: 16px; height: 16px; stroke: #1A0F04; fill: #1A0F04; }
  .brand span { font-weight: 800; font-size: 14.5px; letter-spacing: -0.01em; }

  .nav-group-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--canvas-muted);
    padding: 10px 10px 2px;
  }
  nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--canvas-text);
    font: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
  }
  .nav-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--canvas-border);
    flex-shrink: 0;
  }
  .nav-item:hover { background: var(--canvas-panel-2); }
  .nav-item[aria-current="true"] {
    background: var(--canvas-panel-2);
    font-weight: 700;
  }
  .nav-item[aria-current="true"] .dot { background: var(--brand500); }
  .nav-item .route {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--canvas-muted);
  }

  .sidebar-foot {
    margin-top: auto;
    font-size: 11.5px;
    color: var(--canvas-muted);
    padding: 10px 10px 0;
    border-top: 1px solid var(--canvas-border);
    line-height: 1.5;
  }

  .stage {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    padding: 26px 32px 40px;
    gap: 18px;
  }
  .stage-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .stage-top h1 {
    margin: 0;
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.01em;
  }
  .stage-top .subtitle {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--canvas-muted);
    max-width: 60ch;
  }
  .stage-top .path {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--canvas-muted);
    background: var(--canvas-panel-2);
    border: 1px solid var(--canvas-border);
    padding: 2px 7px;
    border-radius: 6px;
    margin-top: 8px;
    display: inline-block;
  }

  .code-toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 9px 14px;
    border-radius: 10px;
    border: 1px solid var(--canvas-border);
    background: var(--canvas-panel);
    color: var(--canvas-text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
  }
  .code-toggle svg { width: 15px; height: 15px; }
  .code-toggle:hover { background: var(--canvas-panel-2); }
  .code-toggle[aria-pressed="true"] {
    background: var(--brand500);
    border-color: var(--brand500);
    color: #1A0F04;
  }

  .stage-body {
    display: flex;
    gap: 22px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  /* ============ Phone frame ============ */
  .phone-wrap { flex-shrink: 0; }
  .phone {
    width: 382px;
    height: 780px;
    background: var(--ink0);
    border-radius: 46px;
    border: 10px solid #050506;
    box-shadow: 0 24px 50px -18px rgba(0,0,0,0.35), 0 0 0 1px var(--canvas-border);
    position: relative;
    overflow: hidden;
  }
  :root[data-theme="light"] .phone,
  :root:not([data-theme="dark"]):not([data-theme="light"]) .phone {
    box-shadow: 0 24px 50px -18px rgba(20,20,25,0.28), 0 0 0 1px var(--canvas-border);
  }
  .phone::before {
    content: "";
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 22px;
    background: #050506;
    border-radius: 0 0 14px 14px;
    z-index: 40;
  }
  .statusbar {
    height: 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--app-white);
    position: relative;
    z-index: 30;
  }
  .statusbar svg { width: 14px; height: 14px; }
  .statusbar .icons { display: flex; gap: 4px; align-items: center; }

  .screen {
    position: absolute;
    top: 40px; left: 0; right: 0; bottom: 0;
    overflow: hidden;
    background: var(--ink0);
  }
  .screen-scroll {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen-scroll::-webkit-scrollbar { width: 0; }

  /* ============ Code panel ============ */
  .code-panel {
    width: 360px;
    flex-shrink: 0;
    background: var(--canvas-panel);
    border: 1px solid var(--canvas-border);
    border-radius: 16px;
    overflow: hidden;
    max-height: 780px;
    display: flex;
    flex-direction: column;
  }
  .code-panel[hidden] { display: none; }
  .code-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--canvas-border);
    background: var(--canvas-panel-2);
  }
  .code-panel-head span {
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .code-panel-head button {
    border: none;
    background: transparent;
    color: var(--canvas-muted);
    cursor: pointer;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    font-size: 15px;
  }
  .code-panel-head button:hover { background: var(--canvas-border); }
  .code-panel-body {
    padding: 6px 0;
    overflow-y: auto;
  }
  .spec-group {
    padding: 10px 14px 12px;
    border-bottom: 1px solid var(--canvas-border);
  }
  .spec-group:last-child { border-bottom: none; }
  .spec-group h3 {
    margin: 0 0 8px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--canvas-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .spec-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 0;
    font-family: var(--mono);
    font-size: 12px;
  }
  .spec-row .k { color: var(--canvas-muted); }
  .spec-row .v {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--canvas-text);
    font-weight: 500;
    text-align: right;
  }
  .swatch {
    width: 13px; height: 13px;
    border-radius: 4px;
    border: 1px solid rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .stage-empty-hint {
    font-size: 12px;
    color: var(--canvas-muted);
    padding: 40px 14px;
    text-align: center;
  }

  @media (max-width: 900px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; overflow-x: auto; align-items: center; }
    .sidebar-foot { display: none; }
    .brand { flex-shrink: 0; }
    nav { flex-direction: row; }
    .nav-group-label { display: none; }
    .stage { padding: 18px 16px 32px; }
    .phone { width: 92vw; max-width: 382px; }
  }

  /* ============ Shared "app" component classes (used inside .screen) ============ */
  .app-txt { font-family: "Inter", sans-serif; }
  .app-scroll-pad { padding-bottom: 110px; }

  .tabbar {
    position: absolute;
    bottom: 26px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 20px;
    background: var(--tabbg);
    border: 1.2px solid var(--ink200);
    border-radius: 50px;
    padding: 13px 20px;
    z-index: 50;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .tabbar button {
    background: none; border: none; padding: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .tabbar svg { width: 21px; height: 21px; }

  .app-header {
    background: var(--ink50);
    border-bottom: 1px solid var(--ink200);
    padding: 14px 16px 16px;
    display: flex;
    align-items: center;
    position: relative;
  }
  .app-header .back {
    width: 42px; height: 42px;
    border-radius: 14px;
    background: var(--ink100);
    border: 1.5px solid var(--ink200);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .app-header .back svg { width: 19px; height: 19px; stroke: var(--app-white); }
  .app-header .titles { flex: 1; text-align: center; margin: 0 -42px; }
  .app-header .titles h2 { margin: 0; font-size: 17px; font-weight: 700; color: var(--app-white); letter-spacing: -0.2px; }
  .app-header .titles p { margin: 2px 0 0; font-size: 12px; color: var(--ink400); }
  .app-header .spacer { width: 42px; flex-shrink: 0; }

  .card {
    background: var(--ink50);
    border: 1.5px solid var(--ink200);
    border-radius: 20px;
  }
  .btn-primary {
    background: var(--brand500);
    color: #1A0F04;
    border: none;
    border-radius: 15px;
    height: 52px;
    font-weight: 700;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%;
    cursor: pointer;
  }
  .btn-primary svg { width: 18px; height: 18px; }
  .input-outline {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    border: 1.5px solid var(--ink200);
    border-radius: 14px;
    padding: 0 14px;
    background: transparent;
  }
  .input-outline .icn {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: var(--ink0);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .input-outline .icn svg { width: 15px; height: 15px; stroke: var(--ink400); }
  .input-outline input {
    border: none; background: none; outline: none;
    color: var(--app-white); font: inherit; font-size: 14px; flex: 1;
    font-family: "Inter", sans-serif;
  }
  .input-outline input::placeholder { color: var(--ink400); }
  .field-label { font-size: 12.5px; color: var(--ink500); margin-bottom: 6px; display: block; font-weight: 500; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <div class="mark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></div>
    <span>Central Charge</span>
  </div>

  <div>
    <div class="nav-group-label">Autenticação</div>
    <nav id="nav-auth"></nav>
  </div>
  <div>
    <div class="nav-group-label">App (abas)</div>
    <nav id="nav-tabs"></nav>
  </div>
  <div>
    <div class="nav-group-label">App (pilha)</div>
    <nav id="nav-stack"></nav>
  </div>

  <div class="sidebar-foot">
    Gerado a partir do código real em <code>src/app</code> e <code>src/components</code>. Peça mudanças que eu edito este arquivo — e o código do app, se quiser aplicar de verdade.
  </div>
</aside>

<main class="stage">
  <div class="stage-top">
    <div>
      <h1 id="screenTitle"></h1>
      <p class="subtitle" id="screenSubtitle"></p>
      <span class="path" id="screenPath"></span>
    </div>
    <button class="code-toggle" id="codeToggle" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      Ver código / tokens
    </button>
  </div>

  <div class="stage-body">
    <div class="phone-wrap">
      <div class="phone">
        <div class="statusbar">
          <span>9:41</span>
          <span class="icons">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
            <svg viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="18" height="10" rx="2.5" stroke="currentColor" stroke-width="1.6"/><rect x="4" y="9" width="12" height="6" rx="1" fill="currentColor"/><rect x="21" y="10" width="1.6" height="4" rx="0.8" fill="currentColor"/></svg>
          </span>
        </div>
        <div class="screen" id="screenRoot"></div>
      </div>
    </div>

    <aside class="code-panel" id="codePanel" hidden>
      <div class="code-panel-head">
        <span>Tokens &amp; medidas — esta tela</span>
        <button id="codeClose" type="button" aria-label="Fechar">✕</button>
      </div>
      <div class="code-panel-body" id="codeBody"></div>
    </aside>
  </div>
</main>

          '<div class="app-scroll-pad" style="padding-top:8px;">' +
          items.map(function (n) {
            return '<div style="display:flex;align-items:center;background:' + (n.unread ? "var(--ink100)" : "var(--ink50)") + ';border-bottom:1px solid var(--ink200);padding:14px 16px;">' +
              '<div style="width:46px;height:46px;border-radius:14px;background:color-mix(in srgb, ' + n.color + ' 13%, transparent);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="width:22px;height:22px;color:' + n.color + '">' + ic(n.icon) + '</span></div>' +
              '<div style="flex:1;margin:0 8px 0 12px;min-width:0;">' +
                '<div style="display:flex;align-items:center;gap:6px;">' + (n.unread ? '<span style="width:7px;height:7px;border-radius:4px;background:var(--brand400);flex-shrink:0;"></span>' : "") + '<span style="font-size:14px;font-weight:700;color:var(--app-white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + n.title + '</span></div>' +
                '<div style="font-size:12px;color:var(--ink400);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' + n.msg + '</div>' +
              '</div>' +
              '<div style="text-align:center;background:var(--ink100);border-radius:10px;padding:5px 8px;min-width:42px;flex-shrink:0;"><div style="font-size:13px;font-weight:700;color:var(--ink300);line-height:1;">' + n.day + '</div><div style="font-size:8px;font-weight:600;color:var(--ink500);margin-top:2px;">' + n.month + '</div></div>' +
              '<span style="width:16px;height:16px;color:var(--ink400);margin-left:6px;flex-shrink:0;">' + ic("chevronRight") + '</span>' +
            '</div>';
          }).join("") +
          '<p style="text-align:center;font-size:12px;color:var(--ink500);margin-top:20px;">Você está em dia</p>' +
          '</div>' +
          tabbar("notification") +
        '</div>'
      );
    },
    tokens: [
      { group: "Header", rows: [
        ["bg", "ink50", "#18181B"], ["título", "26px / 700"], ["borda inferior", "1px", "#3F3F46"]
      ]},
      { group: "Card", rows: [
        ["não lida", "bg ink100", "#27272A"], ["lida", "bg ink50", "#18181B"], ["ícone", "46×46, radius 14"], ["date box", "radius 10, min-w 42"]
      ]},
      { group: "Cor por tipo", rows: [
        ["charge / payment", "brand400", "#F97316"], ["alert", "error", "#EF4444"], ["info", "info", "#3B82F6"], ["gift", "brand300", "#FB923C"]
      ]}
    ]
  };

  /* ---------------- MENU — src/app/(app)/(tabs)/menu/index.tsx ---------------- */
  SCREENS.menu = {
    label: "Menu", group: "tabs", path: "src/app/(app)/(tabs)/menu/index.tsx",
    subtitle: "Perfil, estatísticas e listas de configuração (MenuList / MenuStatCard).",
    render: function () {
      function group(title, items) {
        return '<h4 style="margin:26px 0 9px;padding:0 24px;font-size:13px;font-weight:700;color:var(--ink300);letter-spacing:0.3px;">' + title + '</h4>' +
          '<div style="background:var(--ink50);border-radius:16px;border:1.5px solid var(--ink200);margin:0 20px;overflow:hidden;">' +
          items.map(function (it, i) {
            return '<div style="display:flex;align-items:center;min-height:54px;padding:8px 14px;' + (i < items.length - 1 ? "border-bottom:1px solid var(--ink200);" : "") + '">' +
              '<div style="width:30px;height:30px;border-radius:10px;background:' + (it.danger ? "color-mix(in srgb, var(--error) 15%, transparent)" : "var(--ink100)") + ';display:flex;align-items:center;justify-content:center;"><span style="width:16px;height:16px;color:' + (it.danger ? "var(--error)" : "var(--ink500)") + '">' + ic(it.icon) + '</span></div>' +
              '<div style="flex:1;margin-left:12px;"><div style="font-size:14px;font-weight:600;color:' + (it.danger ? "var(--error)" : "var(--app-white)") + ';">' + it.label + '</div>' + (it.sub ? '<div style="font-size:11px;color:var(--ink400);margin-top:1px;">' + it.sub + '</div>' : "") + '</div>' +
              '<span style="width:16px;height:16px;color:var(--ink400);">' + ic("chevronRight") + '</span>' +
            '</div>';
          }).join("") + "</div>";
      }
      return (
        '<div class="screen-scroll app-txt" style="background:var(--ink0);">' +
          '<div class="app-scroll-pad" style="padding-top:16px;">' +
          '<div style="display:flex;align-items:center;background:var(--ink50);border-radius:20px;border:1.5px solid var(--ink200);padding:20px;margin:0 20px;">' +
            '<div style="width:64px;height:64px;border-radius:32px;background:var(--ink100);border:2px solid var(--brand400);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><span style="width:32px;height:32px;color:var(--brand400);">' + ic("user") + '</span></div>' +
            '<div style="flex:1;margin-left:16px;">' +
              '<div style="font-size:18px;font-weight:700;color:var(--app-white);">Carlos Andrade</div>' +
              '<div style="font-size:13px;color:var(--ink400);margin-top:2px;">carlos@voltcharge.com</div>' +
              '<div style="display:inline-flex;align-items:center;gap:4px;background:color-mix(in srgb, var(--brand400) 13%, transparent);border-radius:8px;padding:4px 8px;margin-top:8px;"><span style="width:12px;height:12px;color:var(--brand300);">' + icFilled("zap") + '</span><span style="font-size:11px;font-weight:600;color:var(--brand300);">Membro Premium</span></div>' +
            '</div>' +
          '</div>' +

          '<div style="display:flex;align-items:center;background:var(--ink50);border-radius:16px;border:1.5px solid var(--ink200);padding:16px 0;margin:12px 20px 0;">' +
            statCol("1.248", "kWh total") + divider() + statCol("47", "recargas") + divider() + statCol("8.2", "tCO₂ evitado") +
          '</div>' +

          group("Conta", [
            { icon: "car", label: "Meu veículo", sub: "Tesla Model 3" },
            { icon: "creditCard", label: "Pagamentos", sub: "Visa •••• 4242" },
            { icon: "gift", label: "Indicações", sub: "Convide amigos" }
          ]) +
          group("Preferências", [
            { icon: "settings", label: "Configurações" },
            { icon: "globe", label: "Idioma", sub: "Português" },
            { icon: "shield", label: "Privacidade" }
          ]) +
          group("Suporte", [
            { icon: "arrowLeft", label: "Central de ajuda" },
            { icon: "logOut", label: "Sair da conta", danger: true }
          ]) +
          '</div>' +
          tabbar("menu") +
        '</div>'
      );

      function statCol(v, l) {
        return '<div style="flex:1;text-align:center;"><div style="font-size:18px;font-weight:700;color:var(--app-white);">' + v + '</div><div style="font-size:11px;color:var(--ink400);margin-top:2px;">' + l + '</div></div>';
      }
      function divider() { return '<div style="width:1px;height:32px;background:var(--ink200);"></div>'; }
    },
    tokens: [
      { group: "Cartão de perfil", rows: [
        ["radius", "20px"], ["avatar", "64×64, radius 32, borda 2px brand400"], ["badge premium", "radius 8, brand400 @ 13%"]
      ]},
      { group: "Grupo de menu", rows: [
        ["radius", "16px"], ["item minH", "54px"], ["ícone item", "30×30, radius 10"], ["item perigo", "error @ 15% / texto error"]
      ]}
    ]
  };

  /* ---------------- VEÍCULOS — src/app/(app)/veiculos/index.tsx ---------------- */
  SCREENS.veiculos = {
    label: "Veículos", group: "stack", path: "src/app/(app)/veiculos/index.tsx",
    subtitle: "Header customizado (src/components/Header) + VehicleCard.",
    render: function () {
      return (
        '<div style="position:absolute;inset:0;background:var(--ink0);">' +
          header("Veículos", "Gerencie seus carros cadastrados") +
          '<div class="screen-scroll" style="top:88px;">' +
            '<div style="background:var(--ink50);border-radius:20px;border:1.5px solid var(--ink200);margin:20px;overflow:hidden;">' +
              '<div style="position:relative;height:200px;background:linear-gradient(135deg,#3a3a3d,#1c1c1e) center/cover;">' +
                '<div style="position:absolute;inset:0;background:rgba(10,10,11,0.25);"></div>' +
                '<div style="position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:19px;background:rgba(10,10,11,0.6);display:flex;align-items:center;justify-content:center;color:var(--app-white);">' + ic("trash") + '</div>' +
              '</div>' +
              '<div style="padding:18px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><span style="font-size:20px;font-weight:700;color:var(--app-white);letter-spacing:-0.3px;">Dolphin Mini</span><span style="font-size:14px;font-weight:600;color:var(--ink400);">BYD</span></div>' +
                '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:var(--ink500);">Placa</span><span style="font-size:15px;font-weight:700;color:var(--app-white);letter-spacing:1.5px;background:var(--ink100);padding:6px 12px;border-radius:8px;">ABC1D23</span></div>' +
              '</div>' +
            '</div>' +
            '<div style="padding:0 20px;"><button class="btn-primary">' + ic("plus") + ' Novo veículo</button></div>' +
          '</div>' +
        '</div>'
      );
    },
    tokens: [
      { group: "Header", rows: [
        ["bg", "ink50", "#18181B"], ["back btn", "42×42, radius 14"], ["borda inferior", "1px", "#3F3F46"]
      ]},
      { group: "VehicleCard", rows: [
        ["radius", "20px"], ["imagem", "altura 200"], ["delete btn", "38×38, radius 19, ink0 @ 60%"], ["placa", "letter-spacing 1.5px"]
      ]}
    ]
  };

  /* ---------------- NOVO VEÍCULO — src/app/(app)/novo-veiculo/index.tsx ---------------- */
  SCREENS.novoVeiculo = {
    label: "Novo veículo", group: "stack", path: "src/app/(app)/novo-veiculo/index.tsx",
    subtitle: "Formulário com 3 inputs outline + botão salvar.",
    render: function () {
      return (
        '<div style="position:absolute;inset:0;background:var(--ink0);">' +
          header("Novo veículo", "Adicione um carro à sua conta") +
          '<div class="screen-scroll" style="top:88px;padding:18px 24px 40px;">' +
            '<div style="width:64px;height:64px;border-radius:20px;background:color-mix(in srgb, var(--brand400) 18%, transparent);border:1px solid color-mix(in srgb, var(--brand400) 55%, transparent);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--brand300);">' + ic("car") + '</div>' +
            '<h2 style="text-align:center;margin:0;font-size:22px;font-weight:700;color:var(--app-white);">Cadastre seu veículo</h2>' +
            '<p style="text-align:center;margin:8px 8px 24px;font-size:13px;line-height:1.5;color:var(--ink400);">Adicione os dados do seu carro para encontrar recargas compatíveis com mais facilidade.</p>' +
            '<div style="background:var(--ink50);border-radius:20px;border:1.5px solid var(--ink200);padding:18px;display:flex;flex-direction:column;gap:14px;">' +
              field("car", "Nome do veículo", "Dolphin Mini") +
              field("tag", "Marca", "BYD") +
              field("hash", "Placa", "ABC1D23") +
            '</div>' +
            '<div style="margin-top:24px;"><button class="btn-primary">' + ic("check") + ' Salvar veículo</button></div>' +
          '</div>' +
        '</div>'
      );
      function field(icon, label, placeholder) {
        return '<div><span class="field-label">' + label + '</span><div class="input-outline"><span class="icn">' + ic(icon) + '</span><input placeholder="Ex.: ' + placeholder + '" /></div></div>';
      }
    },
    tokens: [
      { group: "Ícone intro", rows: [
        ["tamanho", "64×64, radius 20"], ["bg", "brand400 @ 18%"], ["borda", "1px, brand400 @ 55%"]
      ]},
      { group: "Form card", rows: [
        ["radius", "20px"], ["padding", "18px"], ["gap", "8-14px"]
      ]}
    ]
  };

  function header(title, subtitle) {
    return '<div class="app-header"><div class="back">' + ic("chevronLeft") + '</div><div class="titles"><h2>' + title + '</h2><p>' + subtitle + '</p></div><div class="spacer"></div></div>';
  }

  /* ---------------------------------------------------------------------
   * Wire up sidebar nav + rendering
   * ------------------------------------------------------------------- */
  var GROUPS = {
    auth: document.getElementById("nav-auth"),
    tabs: document.getElementById("nav-tabs"),
    stack: document.getElementById("nav-stack")
  };
  var ORDER = ["login", "home", "recharges", "notification", "menu", "scan", "veiculos", "novoVeiculo"];

  var screenTitle = document.getElementById("screenTitle");
  var screenSubtitle = document.getElementById("screenSubtitle");
  var screenPath = document.getElementById("screenPath");
  var screenRoot = document.getElementById("screenRoot");
  var codeToggle = document.getElementById("codeToggle");
  var codePanel = document.getElementById("codePanel");
  var codeClose = document.getElementById("codeClose");
  var codeBody = document.getElementById("codeBody");

  var current = "home";

  function renderCodePanel(id) {
    var spec = SCREENS[id].tokens || [];
    codeBody.innerHTML = spec.map(function (g) {
      return '<div class="spec-group"><h3>' + g.group + '</h3>' + g.rows.map(function (r) {
        var k = r[0], v = r[1], hex = r[2];
        return '<div class="spec-row"><span class="k">' + k + '</span><span class="v">' + (hex ? '<span class="swatch" style="background:' + hex + '"></span>' : "") + v + '</span></div>';
      }).join("") + "</div>";
    }).join("");
  }

  function select(id) {
    current = id;
    var s = SCREENS[id];
    screenTitle.textContent = s.label;
    screenSubtitle.textContent = s.subtitle || "";
    screenPath.textContent = s.path;
    screenRoot.innerHTML = s.render();
    renderCodePanel(id);

    document.querySelectorAll(".nav-item").forEach(function (btn) {
      btn.setAttribute("aria-current", btn.getAttribute("data-id") === id ? "true" : "false");
    });
  }

  ORDER.forEach(function (id) {
    var s = SCREENS[id];
    var btn = document.createElement("button");
    btn.className = "nav-item";
    btn.type = "button";
    btn.setAttribute("data-id", id);
    btn.innerHTML = '<span class="dot"></span><span>' + s.label + "</span>";
    btn.addEventListener("click", function () { select(id); });
    GROUPS[s.group].appendChild(btn);
  });

  codeToggle.addEventListener("click", function () {
    var open = codePanel.hasAttribute("hidden");
    if (open) { codePanel.removeAttribute("hidden"); }
    else { codePanel.setAttribute("hidden", ""); }
    codeToggle.setAttribute("aria-pressed", open ? "true" : "false");
  });
  codeClose.addEventListener("click", function () {
    codePanel.setAttribute("hidden", "");
    codeToggle.setAttribute("aria-pressed", "false");
  });

  select(current);
})();
</script>
</body>
</html>
